<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Strategic Intelligence</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="chart.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header class="brand">
  <div class="brand-name">Strategic Intelligence</div>
  <div class="brand-sub">Powered by AI</div>
  <div class="brand-updated" id="updatedLine">Updated · -</div>
</header>

<section class="impact-summary">
  <div class="impact-summary-head">
    <div class="impact-summary-title">당사 영향도</div>
    <div class="impact-summary-desc">공시·기사·재무 변동이 당사 투자 및 사업에 미치는 영향</div>
  </div>
  <div class="impact-summary-counts">
    <div class="cnt cnt-high"><span class="cnt-dot"></span>높음 <b id="aCnt">0</b></div>
    <div class="cnt cnt-mid"><span class="cnt-dot"></span>중간 <b id="bCnt">0</b></div>
    <div class="cnt cnt-low"><span class="cnt-dot"></span>낮음 <b id="cCnt">0</b></div>
  </div>
</section>

<div class="head">
  <h2>종목 현황</h2>
  <div class="filters">
    <button class="chip on" data-f="ALL">전체</button>
    <button class="chip" data-f="A">높음</button>
    <button class="chip" data-f="B">중간</button>
    <button class="chip" data-f="C">낮음</button>
  </div>
</div>
<div id="list"></div>

<h2 class="mt">핵심 확인사항</h2>
<div id="attnList"></div>
</div>

<div id="backdrop">
  <div id="sheet">
    <div class="handle"></div>
    <button id="close">닫기</button>
    <div id="detail"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
